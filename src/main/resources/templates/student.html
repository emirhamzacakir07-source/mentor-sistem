<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Öğrenci Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; min-height: 100vh; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
        .arkaplan-resmi { position: fixed; top: -5%; left: -5%; width: 110%; height: 110%; background-image: url('https://i.ibb.co/hF8nsNcF/Whats-App-mage-2026-08-28-at-20-10-26.jpg'); background-size: cover; background-position: center; filter: blur(15px) brightness(0.5); z-index: -1; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); padding: 25px; margin-bottom: 25px; }
        .welcome-title { text-align: center; font-size: 2.2rem; font-weight: 800; color: #fff; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); margin-top: 30px; margin-bottom: 30px; }
        .question-box { background: #ffffff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .bg-vazife { background-color: #ff9800 !important; color: #fff; }
        .bg-soru { background-color: #007bff !important; color: #fff; }

        .secenek-kutusu { display: block; padding: 12px; margin-bottom: 10px; border: 2px solid #e9ecef; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-weight: 600; background: #f8f9fa; }
        .secenek-kutusu:hover { background: #e3f2fd; border-color: #007bff; }
        .secenek-kutusu input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
    </style>
</head>
<body>

<div class="arkaplan-resmi"></div>

<div class="container pb-5">
    <h1 class="welcome-title">ÖĞRENCİ GÖSTERGE PANELİ</h1>

    <div class="row justify-content-center">
        <!-- SOL SÜTUN (Sadece Profil) -->
        <div class="col-lg-4">
            <div class="glass-card border-top border-4 border-primary">
                <h4 class="fw-bold"><i class="fas fa-id-badge text-primary"></i> Profil</h4>
                <hr>
                <p class="mb-2"><strong>İsim:</strong> <span th:text="${user != null ? user.fullName : 'Öğrenci'}"></span></p>
                <p class="mb-2"><strong>Sınıf:</strong> <span th:text="${user != null ? user.gradeClass : '-'}"></span></p>
                <hr>
                <p class="mb-0 font-weight-bold">Mentör İrtibat:<br> <span class="text-primary fw-bold">0551 011 86 74</span></p>
            </div>
            <a href="/logout" class="btn btn-danger w-100 fw-bold mb-4 py-2"><i class="fas fa-sign-out-alt"></i> Çıkış Yap</a>
        </div>

        <!-- SAĞ SÜTUN (Sorular ve Vazifeler - Puanlar Gizlendi!) -->
        <div class="col-lg-8">
            <div class="glass-card">
                <h3 class="mb-4 text-center text-primary fw-bold border-bottom pb-3">
                    <i class="fas fa-list-check"></i> ATANAN GÖREVLER
                </h3>

                <div th:if="${#lists.isEmpty(questions)}" class="alert alert-info text-center fw-bold">Şu an cevap bekleyen görev yok.</div>

                <div th:each="q, iterStat : ${questions}" class="question-box border-start border-5"
                     th:classappend="${q.task ? 'border-warning' : 'border-primary'}">

                    <div class="mb-3">
                        <!-- Otomatik Numaralandırma (1. Vazife, 2. Soru gibi) -->
                        <span class="badge px-3 py-2 fs-6 mb-2" th:classappend="${q.task ? 'bg-vazife' : 'bg-soru'}"
                              th:text="${iterStat.count} + '. ' + (${q.task} ? 'Vazife' : 'Soru')">1. Soru</span>

                        <h5 class="mt-2 text-dark fw-bold" th:text="${q.content}">Soru Metni</h5>
                    </div>

                    <!-- Cevaplanmadıysa -->
                    <div th:unless="${#lists.contains(answers.![questionId], q.id)}" class="mt-3 bg-light p-3 rounded border">
                        <form action="/submit-answer" method="post">
                            <input type="hidden" name="questionId" th:value="${q.id}">

                            <!-- Çoktan Seçmeli İse -->
                            <div th:if="${q.type == 'COKTAN_SECMELI'}">
                                <label class="secenek-kutusu">
                                    <input type="radio" name="answerText" th:value="${q.optionA}" required> <span th:text="${q.optionA}">A</span>
                                </label>
                                <label class="secenek-kutusu">
                                    <input type="radio" name="answerText" th:value="${q.optionB}"> <span th:text="${q.optionB}">B</span>
                                </label>
                                <label class="secenek-kutusu">
                                    <input type="radio" name="answerText" th:value="${q.optionC}"> <span th:text="${q.optionC}">C</span>
                                </label>
                                <label class="secenek-kutusu">
                                    <input type="radio" name="answerText" th:value="${q.optionD}"> <span th:text="${q.optionD}">D</span>
                                </label>
                            </div>

                            <!-- Klasik/Vazife İse -->
                            <div th:if="${q.type != 'COKTAN_SECMELI'}">
                                <textarea class="form-control mb-3" name="answerText" rows="3" placeholder="Cevabınızı buraya yazın..." required></textarea>
                            </div>

                            <button type="submit" class="btn btn-success w-100 fw-bold">Gönder</button>
                        </form>
                    </div>

                    <!-- Cevaplandıysa -->
                    <div th:if="${#lists.contains(answers.![questionId], q.id)}" class="mt-3">
                        <div class="alert alert-success fw-bold mb-0">
                            <i class="fas fa-check-circle"></i> Tamamlandı! Değerlendirme bekleniyor.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
