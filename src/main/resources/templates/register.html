<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol - Mentörlük Programı</title>

    <!-- Giriş ekranındaki aynı havalı fontu (Montserrat) buraya da ekledik -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', Arial, sans-serif; /* Tüm yazılar Montserrat oldu */
            color: #333;
        }

        /* Kitap okuyan ve eğlenen çocukların olduğu yeni arka plan */
        .arkaplan-resmi {
            position: fixed;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            /* Eğlenceli vakit geçiren ve öğrenen çocuklar temalı yüksek kaliteli görsel */
            background-image: url('https://images.unsplash.com/photo-1503676260728-1c00da094a0b?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: blur(10px) brightness(0.65); /* Form öne çıksın diye bulanıklaştırıldı */
            z-index: -1;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.92); /* Hafif saydam cam efekti */
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); /* Derinlik veren gölge */
            border: none;
            padding: 40px;
        }

        .form-title {
            font-weight: 800;
            color: #2c3e50;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 700;
            font-size: 0.9rem;
            color: #444;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
        }

        .btn-success {
            padding: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            background-color: #28a745;
            border: none;
            transition: 0.3s;
        }

        .btn-success:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }

        .alt-link {
            color: #007bff;
            font-weight: 700;
            text-decoration: none;
            transition: 0.3s;
        }

        .alt-link:hover {
            color: #0056b3;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="arkaplan-resmi"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-9 col-lg-7">
            <div class="card">
                <h3 class="text-center form-title">Öğrenci Kayıt Formu</h3>

                <div th:if="${error != null}" class="alert alert-danger text-center fw-bold" th:text="${error}"></div>

                <form action="/register" method="post">
                    <div class="row">
                        <!-- ZORUNLU ALANLAR (required) -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Ad Soyad</label>
                            <input type="text" class="form-control" name="fullName" placeholder="Adınız ve Soyadınız" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Kullanıcı Adı</label>
                            <input type="text" class="form-control" name="username" placeholder="Sisteme giriş için" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Şifre Belirle</label>
                            <input type="password" class="form-control" name="password" placeholder="Güçlü bir şifre" required>
                        </div>

                        <!-- TEK ZORUNLU OLMAYAN ALAN (Varsa) -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Öğrenci Telefon (Varsa)</label>
                            <input type="text" class="form-control" name="personalPhone" placeholder="05XX XXX XX XX">
                        </div>

                        <!-- ZORUNLU ALANLAR (required) -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Veli Telefon</label>
                            <input type="text" class="form-control" name="parentPhone" placeholder="05XX XXX XX XX" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Okul</label>
                            <input type="text" class="form-control" name="school" placeholder="Okulunuzun Adı" required>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Sınıfı</label>
                            <input type="text" class="form-control" name="gradeClass" placeholder="Örn: 7/B" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 mt-4">Kayıt İşlemini Tamamla</button>
                </form>

                <div class="text-center mt-4">
                    <a href="/" class="alt-link">Zaten hesabın var mı? Giriş Yap</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
