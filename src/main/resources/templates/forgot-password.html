<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Şifremi Unuttum - Mentörlük Programı</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #f4f7f6; display: flex; align-items: center; height: 100vh;">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4 shadow">
        <h4 class="text-center mb-3">Şifremi Unuttum</h4>
        <p class="text-muted text-center">Kullanıcı adınızı girin, yöneticiye bildirim gönderelim.</p>

        <!-- Backend'den gelen başarı veya hata mesajları burada gösteriliyor -->
        <div th:if="${success != null}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

        <form action="/forgot-password" method="post">
          <div class="mb-3">
            <input type="text" class="form-control" name="username" placeholder="Kullanıcı adınız" required>
          </div>
          <button type="submit" class="btn btn-warning w-100">Yöneticiye Bildir</button>
        </form>
        <div class="text-center mt-3"><a href="/" class="text-decoration-none">Giriş Ekranına Dön</a></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
