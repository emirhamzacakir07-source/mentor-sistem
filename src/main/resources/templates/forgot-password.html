<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Şifremi Unuttum - Mentörlük Programı</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- YENİ KAYIT 7: SweetAlert2 Kütüphanesi Eklendi -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="background-color: #f4f7f6; display: flex; align-items: center; height: 100vh;">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4 shadow">
        <h4 class="text-center mb-3">Şifremi Unuttum</h4>
        <p class="text-muted text-center">Kullanıcı adınızı girin, yöneticiye bildirim gönderelim.</p>

        <!-- GÜVENLİK GÜNCELLEMESİ: CSRF token uyuşmazlığını önlemek için action -> th:action olarak değiştirildi -->
        <form th:action="@{/forgot-password}" method="post">
          <div class="mb-3">
            <input type="text" class="form-control" name="username" placeholder="Kullanıcı adınız" required>
          </div>
          <button type="submit" class="btn btn-warning w-100">Yöneticiye Bildir</button>
        </form>
        <div class="text-center mt-3"><a href="/" class="text-decoration-none">Giriş Ekranına Dön</a></div>
      </div>
    </div>
  </div>
</div>

<!-- YENİ KAYIT 7: SweetAlert2 Bildirim Kontrolü -->
<script th:inline="javascript">
  /*<![CDATA[*/
  var successMessage = /*[[${success}]]*/ null;
  var errorMsg = /*[[${error}]]*/ null;

  if (successMessage) {
      Swal.fire({
          icon: 'success',
          title: 'Başarılı!',
          text: successMessage,
          confirmButtonColor: '#f59e0b' // Buton rengi temaya (warning) uygun ayarlandı
      });
  }

  if (errorMsg) {
      Swal.fire({
          icon: 'error',
          title: 'Hata!',
          text: errorMsg,
          confirmButtonColor: '#dc3545'
      });
  }
  /*]]>*/
</script>
</body>
</html>
