<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentör Başvuru Portalı</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

        /* ARKAPLAN: Bulanıklaştırılmış Sınıf/Öğretmen Fotoğrafı */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* İstersen buradaki URL'yi kendi bulduğun bir fotoğrafın linkiyle değiştirebilirsin */
            background: url('https://images.unsplash.com/photo-1524178232363-1fb2b075b655?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        /* Fotoğrafı hafif koyulaştıran ve bulanıklaştıran katman */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            z-index: 1;
        }

        /* BUZLU CAM EFEKTLİ BAŞVURU KARTI */
        .register-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            color: #fff;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
        .header p { font-size: 14px; color: #cbd5e1; }

        form { display: flex; flex-direction: column; gap: 15px; }

        .input-group { position: relative; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #cbd5e1; }

        input, select {
            width: 100%;
            padding: 12px 15px 12px 45px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input::placeholder { color: #94a3b8; }
        input:focus, select:focus { border-color: #3b82f6; background: rgba(15, 23, 42, 0.8); }

        /* Select (Açılır Menü) yazılarının siyah kalmaması için ayar */
        select option { background: #1e293b; color: #fff; }

        button {
            padding: 15px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover { background: #2563eb; transform: translateY(-2px); }

        .footer-link { text-align: center; margin-top: 20px; font-size: 13px; }
        .footer-link a { color: #93c5fd; text-decoration: none; font-weight: 600; }
        .footer-link a:hover { color: #bfdbfe; text-decoration: underline; }

        .alert { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 15px; font-size: 14px; }
        .success { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #86efac; }
    </style>
</head>
<body>

<div class="register-container">
    <div class="header">
        <h1><i class="fas fa-chalkboard-teacher"></i> Mentör Başvurusu</h1>
        <p>Liderlik ve Mentörlük Akademisi'ne katılmak için bilgilerinizi doldurun.</p>
    </div>

    <div th:if="${error}" class="alert" th:text="${error}"></div>
    <div th:if="${success}" class="alert success">Başvurunuz alındı! Yönetici onayından sonra sisteme giriş yapabilirsiniz.</div>

    <form action="/mentor-register" method="POST">
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" name="fullName" placeholder="Adınız ve Soyadınız" required>
        </div>

        <div class="input-group">
            <i class="fas fa-id-badge"></i>
            <input type="text" name="username" placeholder="Kullanıcı Adı Belirleyin" required>
        </div>

        <div class="input-group">
            <i class="fas fa-phone"></i>
            <input type="text" name="personalPhone" placeholder="Telefon Numaranız" required>
        </div>

        <div class="input-group">
            <i class="fas fa-map-marker-alt"></i>
            <select name="region" required>
                <option value="" disabled selected>Bulunduğunuz Bölgeyi Seçin</option>
                <option value="Meram">Meram</option>
                <option value="Selçuklu">Selçuklu</option>
                <option value="Karatay">Karatay</option>
                <option value="Diğer">Diğer</option>
            </select>
        </div>

        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="Şifrenizi Belirleyin" required>
        </div>

        <button type="submit">Başvuruyu Gönder</button>
    </form>

    <div class="footer-link">
        <a href="/"><i class="fas fa-arrow-left"></i> Ana Sayfaya (Öğrenci Girişi) Dön</a>
    </div>
</div>

</body>
</html>
