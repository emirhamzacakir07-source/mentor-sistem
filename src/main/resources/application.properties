# Railway PostgreSQL Database Settings
# Password is provided via Railway Variables

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://centerbeam.proxy.rlwy.net:31505/railway}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# --- OTURUM (SESSION) KALICILIK AYARLARI ---
spring.session.store-type=jdbc
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:org/springframework/session/jdbc/schema-postgresql.sql
spring.sql.init.continue-on-error=true