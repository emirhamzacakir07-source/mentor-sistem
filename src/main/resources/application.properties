# Railway PostgreSQL Database Settings
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://centerbeam.proxy.rlwy.net:31505/railway}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# --- \u0130\u015ETE SEN\u0130 S\u0130STEMDEN ATILMAKTAN KURTARACAK O KES\u0130N \u00C7\u00D6Z\u00DCM ---
# Railway'in ba\u011Flant\u0131y\u0131 koparmas\u0131n\u0131 engelleyen \u00F6zel a\u00E7\u0131k tutma (keep-alive) ayarlar\u0131
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000