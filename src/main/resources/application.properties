# Railway PostgreSQL Kal\u0131c\u0131 Veritaban\u0131 Ayarlar\u0131
#
# G\u00DCVENL\u0130K D\u00DCZELTMES\u0130: \u015Eifre art\u0131k burada d\u00FCz metin olarak YAZILMIYOR.
# ${SPRING_DATASOURCE_PASSWORD} ifadesi, uygulaman\u0131n \u00E7al\u0131\u015Ft\u0131\u011F\u0131 ortamdaki
# (Railway'in "Variables" sekmesindeki) bir ortam de\u011Fi\u015Fkeninden okunaca\u011F\u0131
# anlam\u0131na gelir. Bu dosya (application.properties) git'e (GitHub'a) push
# edilse bile art\u0131k i\u00E7inde ger\u00E7ek \u015Fifre olmayaca\u011F\u0131 i\u00E7in risk olu\u015Fturmaz.
#
# YAPMAN GEREKEN: Railway projendeki uygulama servisinin (Postgres'in kendisi
# de\u011Fil, senin "Mentor" servisin) "Variables" sekmesine git ve \u015Fu de\u011Fi\u015Fkeni ekle:
#   SPRING_DATASOURCE_PASSWORD = (Railway'de yeniden olu\u015Fturdu\u011Fun yeni \u015Fifre)
#
# Not: Railway'de ayn\u0131 proje i\u00E7inde bir Postgres eklentisi varsa, Railway genelde
# ba\u011Flant\u0131 bilgilerini otomatik olarak ortam de\u011Fi\u015Fkeni \u015Feklinde (\u00F6r. DATABASE_URL,
# PGPASSWORD gibi) zaten sa\u011Flar. Postgres servisinin "Variables" sekmesine bak\u0131p
# oradaki haz\u0131r de\u011Fi\u015Fkenleri de kullanabilirsin; a\u015Fa\u011F\u0131daki isimlere ba\u011Fl\u0131 kalman
# \u015Fart de\u011Fil, sadece application.properties i\u00E7indeki ${...} isimleriyle Railway
# panelindeki isimlerin birebir e\u015Fle\u015Fti\u011Finden emin ol.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres.railway.internal:5432/railway}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Oturumlar\u0131 (Giri\u015Fleri) RAM yerine Veritaban\u0131nda Kal\u0131c\u0131 Tutma Ayar\u0131
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always